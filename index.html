<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI颜值评分系统 - 十分制</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #2c3e50;
            font-weight: 600;
        }

        .tip {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .main-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
            margin-bottom: 20px;
        }

        .content-wrapper {
            display: flex;
            gap: 30px;
            margin-bottom: 30px;
        }

        .upload-section {
            flex: 1;
            min-width: 0;
        }

        .upload-box {
            width: 100%;
            height: 360px;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8fafc;
            overflow: hidden;
            position: relative;
        }

        .upload-box:hover {
            border-color: #3b82f6;
            background: #eff6ff;
        }

        .upload-box.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 12px;
            color: #94a3b8;
        }

        .upload-text {
            color: #64748b;
            font-size: 14px;
        }

        .loading-text {
            color: #3b82f6;
            font-size: 14px;
            margin-top: 10px;
        }

        #previewImg {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: none;
        }

        #fileInput {
            display: none;
        }

        #hiddenCanvas {
            display: none;
        }

        .score-section {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .dimension-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dimension-label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 500;
            color: #475569;
        }

        .dimension-score {
            color: #3b82f6;
            font-weight: 600;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s;
        }

        input[type="range"]:disabled {
            cursor: default;
        }

        input[type="range"]:disabled::-webkit-slider-thumb {
            cursor: default;
            opacity: 0.9;
        }

        .result-section {
            display: flex;
            gap: 30px;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }

        .total-score-box {
            flex: 1;
            text-align: center;
        }

        .total-label {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .total-score {
            font-size: 64px;
            font-weight: 700;
            color: #3b82f6;
            line-height: 1;
            margin-bottom: 12px;
        }

        .comment {
            font-size: 15px;
            color: #475569;
            line-height: 1.6;
            padding: 0 20px;
        }

        .radar-box {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        #radarCanvas {
            width: 280px;
            height: 280px;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .content-wrapper, .result-section {
                flex-direction: column;
            }

            .upload-box {
                height: 280px;
            }

            .total-score {
                font-size: 48px;
            }

            #radarCanvas {
                width: 240px;
                height: 240px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI颜值评分系统（十分制）</h1>
        <div class="tip">上传正面清晰照片，AI基于大众审美标准自动评分 | 分数由算法固定生成，不可手动修改</div>
        
        <div class="main-card">
            <div class="content-wrapper">
                <div class="upload-section">
                    <div class="upload-box" id="uploadBox">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">点击或拖拽上传正面照片</div>
                        <div class="loading-text" id="loadingText" style="display:none;">正在分析人脸...</div>
                        <img id="previewImg" alt="预览图">
                    </div>
                    <input type="file" id="fileInput" accept="image/*">
                    <canvas id="hiddenCanvas"></canvas>
                </div>

                <div class="score-section">
                    <div class="dimension-item">
                        <div class="dimension-label">
                            <span>面部对称性（15%）</span>
                            <span class="dimension-score" id="symmetryVal">--</span>
                        </div>
                        <input type="range" id="symmetry" min="0" max="10" step="0.1" value="5" disabled>
                    </div>

                    <div class="dimension-item">
                        <div class="dimension-label">
                            <span>眉眼整体（25%）</span>
                            <span class="dimension-score" id="eyeBrowVal">--</span>
                        </div>
                        <input type="range" id="eyeBrow" min="0" max="10" step="0.1" value="5" disabled>
                    </div>

                    <div class="dimension-item">
                        <div class="dimension-label">
                            <span>五官比例·三庭五眼（20%）</span>
                            <span class="dimension-score" id="proportionVal">--</span>
                        </div>
                        <input type="range" id="proportion" min="0" max="10" step="0.1" value="5" disabled>
                    </div>

                    <div class="dimension-item">
                        <div class="dimension-label">
                            <span>皮肤状态（15%）</span>
                            <span class="dimension-score" id="skinVal">--</span>
                        </div>
                        <input type="range" id="skin" min="0" max="10" step="0.1" value="5" disabled>
                    </div>

                    <div class="dimension-item">
                        <div class="dimension-label">
                            <span>颅顶与脸型（10%）</span>
                            <span class="dimension-score" id="hairVal">--</span>
                        </div>
                        <input type="range" id="hair" min="0" max="10" step="0.1" value="5" disabled>
                    </div>

                    <div class="dimension-item">
                        <div class="dimension-label">
                            <span>气质与氛围感（15%）</span>
                            <span class="dimension-score" id="vibeVal">--</span>
                        </div>
                        <input type="range" id="vibe" min="0" max="10" step="0.1" value="5" disabled>
                    </div>
                </div>
            </div>

            <div class="result-section">
                <div class="total-score-box">
                    <div class="total-label">综合颜值评分</div>
                    <div class="total-score" id="totalScore">--</div>
                    <div class="comment" id="comment">上传照片后自动生成评分结果</div>
                </div>
                <div class="radar-box">
                    <canvas id="radarCanvas" width="280" height="280"></canvas>
                </div>
            </div>
        </div>

        <div class="footer-note">结果仅供娱乐参考，审美多元，不必过度较真</div>
    </div>

    <script>
        // ========== 权重配置（固定标准） ==========
        const weights = {
            symmetry: 0.15,   // 面部对称性
            eyeBrow: 0.25,    // 眉眼整体（核心颜值项）
            proportion: 0.20, // 五官比例·三庭五眼
            skin: 0.15,       // 皮肤状态
            hair: 0.10,       // 颅顶与脸型
            vibe: 0.15        // 气质与氛围感
        };

        const dimensionNames = ['面部对称', '眉眼', '比例', '皮肤', '脸型', '气质'];
        const sliderIds = ['symmetry', 'eyeBrow', 'proportion', 'skin', 'hair', 'vibe'];

        // ========== DOM元素 ==========
        const uploadBox = document.getElementById('uploadBox');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const loadingText = document.getElementById('loadingText');
        const totalScoreEl = document.getElementById('totalScore');
        const commentEl = document.getElementById('comment');
        const canvas = document.getElementById('radarCanvas');
        const ctx = canvas.getContext('2d');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hiddenCtx = hiddenCanvas.getContext('2d');

        let modelLoaded = false;

        // ========== 加载本地模型文件 ==========
        async function loadModels() {
            const MODEL_URL = './weights';
            try {
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL)
                ]);
                modelLoaded = true;
            } catch (e) {
                console.error('模型加载失败', e);
                alert('模型文件加载失败，请确认weights文件夹已正确上传');
            }
        }
        loadModels();

        // ========== 图片上传处理 ==========
        uploadBox.addEventListener('click', () => fileInput.click());
        
        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.classList.add('dragover');
        });

        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragover');
        });

        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) handleImage(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleImage(file);
        });

        function handleImage(file) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                previewImg.src = e.target.result;
                previewImg.style.display = 'block';
                uploadBox.querySelector('.upload-icon').style.display = 'none';
                uploadBox.querySelector('.upload-text').style.display = 'none';
                
                previewImg.onload = async () => {
                    if (!modelLoaded) {
                        alert('AI模型正在加载中，请稍候再试');
                        return;
                    }
                    await analyzeFace();
                };
            };
            reader.readAsDataURL(file);
        }

        // ========== 核心：人脸分析与自动评分 ==========
        async function analyzeFace() {
            loadingText.style.display = 'block';
            uploadBox.classList.add('loading');

            try {
                const detection = await faceapi
                    .detectSingleFace(previewImg, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.3 }))
                    .withFaceLandmarks();

                if (!detection) {
                    alert('未检测到清晰人脸，请上传正面、光线充足的免冠照片');
                    loadingText.style.display = 'none';
                    uploadBox.classList.remove('loading');
                    return;
                }

                const landmarks = detection.landmarks;
                const points = landmarks.positions;
                const box = detection.detection.box;

                // 各维度原始分计算
                let symmetryScore = calcSymmetryScore(points);
                let eyeBrowScore = calcEyeBrowScore(points);
                let proportionScore = calcProportionScore(points, box);
                let skinScore = await calcSkinScore(points);
                let faceShapeScore = calcFaceShapeScore(points, box);
                let vibeScore = calcVibeScore(symmetryScore, eyeBrowScore, proportionScore);

                // 分数拉伸校准，拉开区间，符合大众审美分布
                symmetryScore = stretchScore(symmetryScore, 3, 8);
                eyeBrowScore = stretchScore(eyeBrowScore, 2, 9);
                proportionScore = stretchScore(proportionScore, 3, 8.5);
                skinScore = stretchScore(skinScore, 2, 9);
                faceShapeScore = stretchScore(faceShapeScore, 2.5, 8.5);
                vibeScore = stretchScore(vibeScore, 2, 9);

                // 自动赋值到滑块（锁死状态，仅展示）
                setSliderValue('symmetry', symmetryScore);
                setSliderValue('eyeBrow', eyeBrowScore);
                setSliderValue('proportion', proportionScore);
                setSliderValue('skin', skinScore);
                setSliderValue('hair', faceShapeScore);
                setSliderValue('vibe', vibeScore);

                calculateTotal();

            } catch (e) {
                console.error('分析失败', e);
                alert('分析出错，请更换图片重试');
            }

            loadingText.style.display = 'none';
            uploadBox.classList.remove('loading');
        }

        // ========== 分数拉伸函数 ==========
        function stretchScore(score, minExpected, maxExpected) {
            let normalized = (score - 5) / 5;
            normalized = Math.sign(normalized) * Math.pow(Math.abs(normalized), 0.7);
            let result = 5 + normalized * 5;
            result = minExpected + (result / 10) * (maxExpected - minExpected);
            return clamp(result, 0, 10);
        }

        // ========== 1. 面部对称性评分 ==========
        function calcSymmetryScore(points) {
            const axisTop = points[27];
            const axisBottom = points[8];
            
            const pairs = [
                [points[36], points[45]],
                [points[39], points[42]],
                [points[48], points[54]],
                [points[3], points[13]],
                [points[5], points[11]],
                [points[17], points[26]],
                [points[19], points[24]],
            ];

            let totalDiffRatio = 0;
            const faceWidth = points[16].x - points[0].x;

            pairs.forEach(([left, right]) => {
                const midX = (left.x + right.x) / 2;
                const axisXAtY = axisTop.x + (axisBottom.x - axisTop.x) * (left.y - axisTop.y) / (axisBottom.y - axisTop.y);
                const offset = Math.abs(midX - axisXAtY);
                totalDiffRatio += offset / faceWidth;
            });

            const avgDiffRatio = totalDiffRatio / pairs.length;
            let score = 10 - (avgDiffRatio / 0.10) * 10;
            return clamp(score, 0, 10);
        }

        // ========== 2. 眉眼整体评分 ==========
        function calcEyeBrowScore(points) {
            const leftEyeWidth = points[39].x - points[36].x;
            const rightEyeWidth = points[45].x - points[42].x;
            const eyeWidth = (leftEyeWidth + rightEyeWidth) / 2;

            const leftEyeHeight = (points[37].y + points[38].y) / 2 - (points[40].y + points[41].y) / 2;
            const rightEyeHeight = (points[43].y + points[44].y) / 2 - (points[46].y + points[47].y) / 2;
            const eyeHeight = (Math.abs(leftEyeHeight) + Math.abs(rightEyeHeight)) / 2;

            const eyeRatio = eyeWidth / eyeHeight;
            let shapeScore;
            if (eyeRatio >= 2.5 && eyeRatio <= 3.5) {
                shapeScore = 10 - Math.abs(eyeRatio - 3) * 3;
            } else {
                shapeScore = Math.max(0, 7 - Math.abs(eyeRatio - 3) * 2);
            }

            const eyeDistance = points[42].x - points[39].x;
            const distRatio = eyeDistance / eyeWidth;
            let distScore;
            if (distRatio >= 0.8 && distRatio <= 1.2) {
                distScore = 10 - Math.abs(distRatio - 1) * 15;
            } else {
                distScore = Math.max(0, 6 - Math.abs(distRatio - 1) * 5);
            }

            const leftBrowY = (points[17].y + points[19].y + points[21].y) / 3;
            const rightBrowY = (points[22].y + points[24].y + points[26].y) / 3;
            const browY = (leftBrowY + rightBrowY) / 2;
            const eyeTopY = (points[37].y + points[38].y + points[43].y + points[44].y) / 4;
            const browEyeDist = eyeTopY - browY;
            const browRatio = browEyeDist / eyeHeight;
            
            let browScore;
            if (browRatio >= 0.4 && browRatio <= 0.8) {
                browScore = 10 - Math.abs(browRatio - 0.6) * 10;
            } else {
                browScore = Math.max(0, 5 - Math.abs(browRatio - 0.6) * 5);
            }

            const score = shapeScore * 0.4 + distScore * 0.35 + browScore * 0.25;
            return clamp(score, 0, 10);
        }

        // ========== 3. 五官比例评分 ==========
        function calcProportionScore(points, box) {
            const faceWidth = points[14].x - points[2].x;
            const eyeWidth = (points[39].x - points[36].x + points[45].x - points[42].x) / 2;
            
            const fiveEyeRatio = faceWidth / eyeWidth;
            const fiveEyeScore = Math.max(0, 10 - Math.abs(fiveEyeRatio - 5) * 2.5);

            const hairlineY = box.y;
            const browY = (points[19].y + points[24].y) / 2;
            const noseY = points[33].y;
            const chinY = points[8].y;

            const upper = browY - hairlineY;
            const middle = noseY - browY;
            const lower = chinY - noseY;

            const total = upper + middle + lower;
            const upperRatio = upper / total;
            const middleRatio = middle / total;
            const lowerRatio = lower / total;
            
            const ideal = 1/3;
            const courtDeviation = (Math.abs(upperRatio - ideal) + Math.abs(middleRatio - ideal) + Math.abs(lowerRatio - ideal)) / 3;
            const courtScore = Math.max(0, 10 - courtDeviation * 50);

            const faceHeight = chinY - hairlineY;
            const hwRatio = faceHeight / faceWidth;
            const hwScore = Math.max(0, 10 - Math.abs(hwRatio - 1.4) * 6);

            const score = fiveEyeScore * 0.35 + courtScore * 0.35 + hwScore * 0.3;
            return clamp(score, 0, 10);
        }

        // ========== 4. 皮肤状态评分 ==========
        async function calcSkinScore(points) {
            hiddenCanvas.width = previewImg.naturalWidth;
            hiddenCanvas.height = previewImg.naturalHeight;
            hiddenCtx.drawImage(previewImg, 0, 0);

            const sampleAreas = [
                { x: points[27].x, y: points[27].y - 15, w: 25, h: 25 },
                { x: points[4].x + 8, y: points[4].y, w: 25, h: 25 },
                { x: points[12].x - 8, y: points[12].y, w: 25, h: 25 }
            ];

            let totalStd = 0;
            let totalBrightness = 0;
            let totalSharpness = 0;
            let validAreas = 0;

            sampleAreas.forEach(area => {
                try {
                    const imgData = hiddenCtx.getImageData(area.x, area.y, area.w, area.h);
                    const data = imgData.data;
                    const grayValues = [];
                    
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
                        grayValues.push(gray);
                    }

                    totalStd += calcStd(grayValues);
                    totalBrightness += grayValues.reduce((a,b) => a+b, 0) / grayValues.length;

                    let sharp = 0;
                    for (let i = 0; i < grayValues.length - 1; i++) {
                        sharp += Math.abs(grayValues[i] - grayValues[i+1]);
                    }
                    totalSharpness += sharp / grayValues.length;
                    
                    validAreas++;
                } catch(e) {}
            });

            if (validAreas === 0) return 5.0;

            const avgStd = totalStd / validAreas;
            const avgBrightness = totalBrightness / validAreas;
            const avgSharpness = totalSharpness / validAreas;

            const uniformityScore = clamp(10 - (avgStd - 8) / 35 * 10, 0, 10);
            const sharpnessPenalty = avgSharpness < 5 ? (avgSharpness / 5) * 0.6 + 0.4 : 1;
            
            let brightnessFactor;
            if (avgBrightness > 80 && avgBrightness < 200) {
                brightnessFactor = 1;
            } else if (avgBrightness <= 80) {
                brightnessFactor = 0.5 + (avgBrightness / 80) * 0.5;
            } else {
                brightnessFactor = 0.5 + ((255 - avgBrightness) / 55) * 0.5;
            }

            const score = uniformityScore * sharpnessPenalty * brightnessFactor;
            return clamp(score, 0, 10);
        }

        // ========== 5. 颅顶与脸型评分 ==========
        function calcFaceShapeScore(points, box) {
            const jawAngle = calcAngle(points[5], points[8], points[11]);
            let jawScore;
            if (jawAngle >= 100 && jawAngle <= 140) {
                jawScore = 10 - Math.abs(jawAngle - 120) / 2;
            } else {
                jawScore = Math.max(0, 5 - Math.abs(jawAngle - 120) / 8);
            }

            const zygomaticWidth = points[14].x - points[2].x;
            const jawWidth = points[10].x - points[6].x;
            const jawRatio = jawWidth / zygomaticWidth;
            let widthScore;
            if (jawRatio >= 0.65 && jawRatio <= 0.95) {
                widthScore = 10 - Math.abs(jawRatio - 0.8) * 15;
            } else {
                widthScore = Math.max(0, 4 - Math.abs(jawRatio - 0.8) * 8);
            }

            let smoothness = 0;
            for (let i = 2; i <= 14; i++) {
                const angle = calcAngle(points[i-1], points[i], points[i+1]);
                smoothness += Math.abs(angle - 180);
            }
            smoothness /= 13;
            const smoothScore = clamp(10 - smoothness / 12, 0, 10);

            const score = jawScore * 0.35 + widthScore * 0.35 + smoothScore * 0.3;
            return clamp(score, 0, 10);
        }

        // ========== 6. 气质氛围感 ==========
        function calcVibeScore(sym, eye, prop) {
            const base = (sym * 0.3 + eye * 0.4 + prop * 0.3);
            const bonus = (eye - 5) * 0.15 + (prop - 5) * 0.08;
            return clamp(base + bonus, 0, 10);
        }

        // ========== 工具函数 ==========
        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        function calcStd(arr) {
            const mean = arr.reduce((a,b) => a+b, 0) / arr.length;
            const variance = arr.reduce((sum, val) => sum + (val - mean)**2, 0) / arr.length;
            return Math.sqrt(variance);
        }

        function calcAngle(p1, p2, p3) {
            const v1 = { x: p1.x - p2.x, y: p1.y - p2.y };
            const v2 = { x: p3.x - p2.x, y: p3.y - p2.y };
            const dot = v1.x * v2.x + v1.y * v2.y;
            const mag1 = Math.sqrt(v1.x**2 + v1.y**2);
            const mag2 = Math.sqrt(v2.x**2 + v2.y**2);
            const cos = dot / (mag1 * mag2);
            return Math.acos(clamp(cos, -1, 1)) * 180 / Math.PI;
        }

        function setSliderValue(id, value) {
            const slider = document.getElementById(id);
            const valEl = document.getElementById(id + 'Val');
            const fixed = value.toFixed(1);
            slider.value = fixed;
            valEl.textContent = fixed;
        }

        // ========== 总分计算 ==========
        function calculateTotal() {
            let total = 0;
            const scores = {};
            
            sliderIds.forEach(id => {
                const val = parseFloat(document.getElementById(id).value);
                scores[id] = val;
                total += val * weights[id];
            });

            const finalScore = total.toFixed(1);
            totalScoreEl.textContent = finalScore;
            commentEl.textContent = getComment(parseFloat(finalScore));
            drawRadar(scores);
        }

        function getComment(score) {
            if (score >= 9.0) return "✨ 颜值天花板！五官精致度接近完美，属于万里挑一的顶级颜值。";
            else if (score >= 8.0) return "🌟 明星级颜值！五官舒展立体，硬件条件非常优秀。";
            else if (score >= 7.5) return "⭐ 颜值出众！整体很帅气，放在人群里很显眼。";
            else if (score >= 7.0) return "👍 颜值中上！清秀舒服，稍加打理气质会更突出。";
            else if (score >= 6.0) return "🙂 普通偏上！干净顺眼，有一定提升空间。";
            else if (score >= 5.0) return "😐 普通路人！五官中规中矩，可通过造型扬长避短。";
            else if (score >= 4.0) return "📝 普通偏下！面部存在明显短板，可针对性改善。";
            else return "💡 基础较弱：面部比例或状态有较多可提升点。";
        }

        // ========== 雷达图绘制 ==========
        function drawRadar(scores) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 100;
            const sides = 6;
            const angleStep = (Math.PI * 2) / sides;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 1; i <= 5; i++) {
                const r = radius * (i / 5);
                ctx.beginPath();
                for (let j = 0; j < sides; j++) {
                    const angle = j * angleStep - Math.PI / 2;
                    const x = centerX + r * Math.cos(angle);
                    const y = centerY + r * Math.sin(angle);
                    if (j === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 1;
                ctx.stroke();
            }

            for (let i = 0; i < sides; i++) {
                const angle = i * angleStep - Math.PI / 2;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(x, y);
                ctx.strokeStyle = '#e2e8f0';
                ctx.stroke();

                const labelRadius = radius + 20;
                const labelX = centerX + labelRadius * Math.cos(angle);
                const labelY = centerY + labelRadius * Math.sin(angle);
                ctx.fillStyle = '#64748b';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(dimensionNames[i], labelX, labelY);
            }

            ctx.beginPath();
            sliderIds.forEach((id, index) => {
                const score = scores[id];
                const angle = index * angleStep - Math.PI / 2;
                const r = radius * (score / 10);
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                if (index === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.closePath();
            ctx.fillStyle = 'rgba(59, 130, 246, 0.2)';
            ctx.fill();
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 2;
            ctx.stroke();

            sliderIds.forEach((id, index) => {
                const score = scores[id];
                const angle = index * angleStep - Math.PI / 2;
                const r = radius * (score / 10);
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#3b82f6';
                ctx.fill();
            });
        }
    </script>
